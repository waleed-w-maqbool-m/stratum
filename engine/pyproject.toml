[project]
name = "stratum-engine"
version = "0.1.0"
description = "Stratum — natural language to SQL for legacy databases"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "sqlglot>=25.30",
    "duckdb>=1.1",
    "rapidfuzz>=3.10",
    "networkx>=3.4",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "httpx>=0.27",
    "openai>=1.54",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Heavy / platform-specific. Install only what you need.
embed = ["fastembed>=0.4"]
mssql = ["pymssql>=2.3"]
postgres = ["psycopg[binary]>=3.2"]
mcp = ["mcp>=1.1"]   # 1.x and 2.x are both supported

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
stratum = "stratum.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stratum"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
